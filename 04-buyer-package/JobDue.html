<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JobDue</title>
  <meta name="theme-color" content="#145f7c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="JobDue">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/jobdue-icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="assets/jobdue-apple-touch-icon.png">
  <style>
    :root {
      color-scheme: light;
      --page: #eef3f5;
      --surface: #ffffff;
      --surface-soft: #fafcfd;
      --ink: #111315;
      --muted: #4f5b63;
      --line: #b9c4cc;
      --accent: #145f7c;
      --accent-strong: #0d465d;
      --accent-soft: #e7f3f6;
      --accent-line: #8fbfcd;
      --proof: #174b5b;
      --proof-soft: #e8f4f6;
      --proof-line: #8fbfcd;
      --success: #176c32;
      --success-soft: #e7f6ec;
      --warning: #5b3e1e;
      --warning-soft: #ffffff;
      --warning-line: #b7792d;
      --danger: #b00012;
      --danger-soft: #ffe8eb;
      --info: #1f6387;
      --info-soft: #e8f2fb;
      --radius: 8px;
      --space-1: 4px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --space-5: 20px;
      --space-6: 24px;
      --space-7: 28px;
      --space-8: 32px;
    }

    * { box-sizing: border-box; }

    html { min-height: 100%; }

    body {
      min-height: 100%;
      margin: 0;
      background: var(--page);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      font-size: 16px;
      letter-spacing: 0;
      overflow-x: hidden;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    button:focus-visible,
    input:focus-visible,
    select:focus-visible,
    textarea:focus-visible,
    summary:focus-visible {
      outline: 3px solid var(--accent-line);
      outline-offset: 2px;
    }

    h1,
    h2,
    h3,
    p {
      margin-top: 0;
    }

    p {
      color: var(--muted);
      line-height: 1.45;
    }

    .app-shell {
      display: grid;
      grid-template-columns: 296px minmax(0, 1fr);
      min-height: 100vh;
    }

    .sidebar {
      position: sticky;
      top: 0;
      height: 100vh;
      padding: var(--space-5);
      border-right: 1px solid var(--line);
      background: var(--surface);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: var(--space-7);
      padding-bottom: var(--space-5);
      border-bottom: 1px solid var(--line);
    }

    .brand-mark {
      flex: 0 0 62px;
      width: 62px;
      height: 62px;
      display: grid;
      place-items: center;
      overflow: hidden;
      border: 1px solid var(--accent-line);
      border-radius: 14px;
      background: var(--surface);
      box-shadow: 0 10px 18px rgba(13, 70, 93, 0.16);
    }

    .brand-mark img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .brand-copy {
      min-width: 0;
      display: grid;
      gap: 4px;
    }

    .brand-title {
      margin: 0;
      color: var(--accent-strong);
      font-size: 28px;
      font-weight: 900;
      line-height: 1.1;
      white-space: nowrap;
    }

    .brand-subtitle {
      margin: 0;
      color: #304149;
      font-size: 16px;
      font-weight: 760;
      line-height: 1.2;
      white-space: nowrap;
    }

    .nav {
      display: grid;
      gap: var(--space-2);
      padding-top: var(--space-2);
    }

    .nav button,
    .bottom-nav button {
      min-height: 44px;
      border: 1px solid transparent;
      border-radius: var(--radius);
      background: transparent;
      color: var(--muted);
      font-weight: 750;
      text-align: left;
    }

    .nav button {
      display: grid;
      grid-template-columns: 46px minmax(0, 1fr);
      align-items: center;
      gap: 10px;
      min-height: 56px;
      padding: 8px 12px;
    }

    .tab-icon {
      display: grid;
      place-items: center;
      width: 40px;
      height: 40px;
      color: currentColor;
    }

    .tab-icon img {
      display: block;
      width: 40px;
      height: 40px;
      border-radius: 10px;
      object-fit: cover;
      box-shadow: 0 1px 3px rgba(17, 19, 21, 0.08);
    }

    .tab-label {
      min-width: 0;
    }

    .nav button.active,
    .bottom-nav button.active {
      border-color: var(--accent-line);
      background: var(--accent-soft);
      color: var(--accent-strong);
    }

    .main {
      min-width: 0;
      padding: var(--space-8);
    }

    .content-wrap {
      max-width: 1240px;
      margin: 0 auto;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-4);
      margin-bottom: var(--space-5);
    }

    .topbar h1 {
      margin: 0;
      font-size: 34px;
      line-height: 1.1;
    }

    .topbar p {
      margin-bottom: 0;
      max-width: 680px;
    }

    .top-title {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      min-width: 0;
    }

    .help-wrap {
      position: relative;
      display: inline-grid;
      place-items: center;
    }

    .help-tip {
      display: inline-grid;
      place-items: center;
      width: 28px;
      height: 28px;
      min-height: 28px;
      padding: 0;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--surface);
      color: var(--muted);
      font-size: 14px;
      font-weight: 850;
      line-height: 1;
    }

    .help-tip:hover {
      border-color: var(--accent-line);
      background: var(--accent-soft);
      color: var(--accent-strong);
    }

    .help-tip[aria-expanded="true"] {
      border-color: var(--accent);
      background: var(--accent-soft);
      color: var(--accent-strong);
    }

    .help-popover {
      position: absolute;
      top: calc(100% + 8px);
      left: 0;
      z-index: 10;
      width: min(300px, calc(100vw - 40px));
      padding: var(--space-3);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      color: var(--ink);
      box-shadow: 0 12px 28px rgba(17, 19, 21, .14);
      font-size: 14px;
      font-weight: 500;
      line-height: 1.35;
    }

    .help-popover[hidden] {
      display: none;
    }

    .top-actions {
      display: grid;
      grid-template-columns: auto auto;
      justify-content: flex-end;
      align-items: center;
      gap: var(--space-2);
    }

    .top-date {
      margin-left: auto;
      color: var(--muted);
      font-size: 16px;
      font-weight: 800;
      line-height: 1.2;
      text-align: right;
      white-space: nowrap;
    }

    .btn {
      min-height: 44px;
      padding: 10px 14px;
      border: 1px solid var(--accent);
      border-radius: var(--radius);
      background: var(--accent);
      color: #fff;
      font-weight: 750;
      white-space: nowrap;
    }

    .btn:hover {
      background: var(--accent-strong);
      border-color: var(--accent-strong);
    }

    .btn.secondary {
      border-color: var(--line);
      background: var(--surface);
      color: var(--ink);
    }

    .btn.secondary:hover {
      border-color: var(--accent-line);
      background: var(--accent-soft);
      color: var(--accent-strong);
    }

    .btn.danger {
      border-color: var(--danger);
      background: var(--danger-soft);
      color: var(--danger);
    }

    .btn.ghost {
      border-color: transparent;
      background: transparent;
      color: var(--accent-strong);
    }

    .panel,
    .card,
    .metric,
    .job-card,
    .action-item,
    .modal-card,
    .notice,
    .route-card {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
    }

    .panel {
      padding: var(--space-4);
    }

    .panel + .panel,
    .section + .section {
      margin-top: var(--space-5);
    }

    .section-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: var(--space-3);
      margin-bottom: var(--space-3);
    }

    .section-head h2 {
      margin-bottom: var(--space-1);
      font-size: 20px;
      line-height: 1.2;
    }

    .section-head p {
      margin-bottom: 0;
      font-size: 15px;
    }

    .metric-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: var(--space-3);
      margin-bottom: var(--space-4);
    }

    .metric-grid.compact {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .metric-grid.jobs-route-grid {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .panel > .metric-grid:last-child {
      margin-bottom: 0;
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: var(--space-3);
    }

    .summary-card {
      min-width: 0;
      padding: var(--space-4);
      border: 1px solid var(--line);
      border-left: 4px solid var(--accent);
      border-radius: var(--radius);
      background: var(--surface-soft);
    }

    button.summary-card {
      width: 100%;
      color: inherit;
      font: inherit;
      text-align: left;
      cursor: pointer;
    }

    button.summary-card:hover {
      background: var(--surface);
    }

    button.summary-card:focus-visible {
      outline: 3px solid rgba(20, 95, 120, 0.22);
      outline-offset: 2px;
    }

    .summary-card strong {
      display: block;
      margin-bottom: var(--space-1);
      color: var(--ink);
      font-size: 24px;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }

    .summary-card span {
      display: block;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.35;
    }

    .metric {
      min-width: 0;
      padding: var(--space-4);
      border-left: 4px solid var(--accent-line);
    }

    button.metric {
      width: 100%;
      color: inherit;
      font: inherit;
      text-align: left;
      cursor: pointer;
    }

    button.metric:hover {
      background: var(--surface-soft);
    }

    button.metric:focus-visible {
      outline: 3px solid rgba(20, 95, 120, 0.22);
      outline-offset: 2px;
    }

    .metric.active {
      box-shadow: inset 0 0 0 2px var(--accent-line);
    }

    .metric.active .metric-label {
      color: var(--accent-strong);
    }

    .metric-grid .route-filter-card {
      position: relative;
      transition: background 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .metric-grid .route-filter-card.active {
      border: 2px solid var(--accent);
      border-left-width: 6px;
      background: var(--accent-soft);
      box-shadow: 0 0 0 3px rgba(20, 95, 120, 0.12);
    }

    .metric-grid .route-filter-card.active.danger,
    .metric-grid .route-filter-card.active.warn {
      border-left-color: var(--accent);
    }

    .route-selected-badge {
      position: absolute;
      top: 10px;
      right: 10px;
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      border-radius: 999px;
      background: var(--accent);
      color: #fff;
      padding: 3px 9px;
      font-size: 12px;
      font-weight: 850;
      line-height: 1;
    }

    .metric.action {
      display: grid;
      align-content: start;
    }

    .metric-action-btn {
      justify-self: start;
      min-height: 32px;
      margin-top: var(--space-2);
      padding: 6px 10px;
      font-size: 13px;
    }

    .metric.money {
      border-left-color: var(--accent);
      background: var(--proof-soft);
    }

    .metric.warn {
      border-left-color: var(--warning-line);
    }

    .metric.danger {
      border-left-color: var(--danger);
      background: var(--danger-soft);
    }

    .metric.success {
      border-left-color: var(--success);
      background: var(--success-soft);
    }

    .metric-label {
      display: block;
      margin-bottom: var(--space-2);
      color: var(--muted);
      font-size: 13px;
      font-weight: 750;
    }

    .metric-value {
      display: block;
      color: var(--ink);
      font-size: 34px;
      font-weight: 800;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }

    .metric-note {
      display: block;
      margin-top: 6px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.3;
    }

    .notice {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: var(--space-3);
      margin-bottom: var(--space-4);
      padding: var(--space-4);
      border-left: 4px solid var(--accent);
    }

    .notice.warning {
      border-left-color: var(--warning-line);
      background: var(--warning-soft);
    }

    .notice.danger {
      border-left-color: var(--danger);
      background: var(--danger-soft);
    }

    .notice h2,
    .notice h3 {
      margin-bottom: var(--space-1);
      font-size: 18px;
    }

    .notice p {
      margin-bottom: 0;
    }

    .notice-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: var(--space-2);
    }

    .ledger {
      display: grid;
      gap: var(--space-2);
    }

    .action-item,
    .route-card,
    .job-card {
      padding: var(--space-3);
    }

    .action-item {
      display: grid;
      grid-template-columns: minmax(0, 1.2fr) minmax(0, 1.3fr) auto;
      gap: var(--space-3);
      align-items: center;
    }

    .action-main strong,
    .job-title strong,
    .route-card strong {
      display: block;
      margin-bottom: 3px;
      color: var(--ink);
      line-height: 1.25;
    }

    .action-main span,
    .job-title span,
    .route-card span {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.35;
    }

    .action-meta {
      display: flex;
      flex-wrap: wrap;
      gap: var(--space-2);
      align-items: center;
    }

    .payment-meta {
      display: grid;
      justify-items: center;
      gap: 4px;
      text-align: center;
    }

    .payment-meta .badge {
      justify-content: center;
      min-width: 140px;
    }

    .payment-meta small {
      color: var(--muted);
      font-size: 13px;
      font-weight: 650;
      line-height: 1.2;
    }

    .money-row {
      grid-template-columns: minmax(0, 1.35fr) minmax(180px, .9fr) minmax(130px, auto);
    }

    .money-row > .cell-main {
      justify-items: start;
      text-align: left;
    }

    .money-row > .cell-main:last-child {
      justify-items: end;
      text-align: right;
      min-width: 130px;
    }

    .today-action {
      grid-template-columns: minmax(180px, 1.05fr) minmax(260px, 1.15fr) minmax(220px, 1.2fr);
    }

    .today-action > * {
      min-width: 0;
    }

    .today-action .action-meta {
      display: grid;
      grid-template-columns: 88px 150px minmax(110px, 1fr);
      gap: var(--space-2);
      align-items: center;
    }

    .today-action .action-meta .badge,
    .today-action .action-meta .amount {
      justify-self: start;
    }

    .amount {
      color: var(--ink);
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      min-height: 26px;
      max-width: 100%;
      padding: 5px 8px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--surface-soft);
      color: var(--muted);
      font-size: 13px;
      font-weight: 750;
      line-height: 1.1;
      white-space: nowrap;
    }

    .badge.accent {
      border-color: var(--accent-line);
      background: var(--accent-soft);
      color: var(--accent-strong);
    }

    .badge.success {
      border-color: #9fd4ad;
      background: var(--success-soft);
      color: var(--success);
    }

    .badge.warn {
      border-color: var(--warning-line);
      background: #fff;
      color: var(--warning);
    }

    .badge.danger {
      border-color: #f1a3aa;
      background: var(--danger-soft);
      color: var(--danger);
    }

    .controls {
      display: grid;
      grid-template-columns: minmax(180px, 1.4fr) minmax(140px, .8fr) minmax(140px, .8fr) minmax(140px, .8fr) minmax(140px, .8fr);
      gap: var(--space-2);
      margin-bottom: var(--space-4);
    }

    .field {
      display: grid;
      gap: 6px;
      min-width: 0;
    }

    .field label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-2);
      color: var(--muted);
      font-size: 13px;
      font-weight: 750;
    }

    .field.required {
      padding: 8px;
      border: 1px solid var(--accent-line);
      border-left: 4px solid var(--accent);
      border-radius: var(--radius);
      background: #f6fbfc;
    }

    .field.required label {
      color: var(--ink);
      font-weight: 850;
    }

    .required-tag {
      display: inline-flex;
      align-items: center;
      min-height: 20px;
      padding: 2px 7px;
      border: 1px solid var(--accent-line);
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent-strong);
      font-size: 12px;
      font-weight: 800;
      line-height: 1;
      white-space: nowrap;
    }

    .field input,
    .field select,
    .field textarea {
      width: 100%;
      min-height: 44px;
      padding: 10px 11px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fff;
      color: var(--ink);
    }

    .field input[type="checkbox"] {
      width: 22px;
      min-height: 22px;
      height: 22px;
      margin: 8px 0;
      accent-color: var(--accent);
    }

    .field textarea {
      min-height: 92px;
      resize: vertical;
    }

    .table-wrap {
      overflow-x: auto;
      border-radius: var(--radius);
      background: transparent;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 820px;
    }

    .job-table {
      min-width: 980px;
      border-collapse: separate;
      border-spacing: 0 var(--space-2);
    }

    th,
    td {
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      vertical-align: top;
    }

    th {
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
    }

    tr:last-child td {
      border-bottom: 0;
    }

    tbody tr:hover {
      background: var(--surface-soft);
    }

    .job-table th {
      padding: 0 12px 4px;
      border-bottom: 0;
      color: #42515a;
      font-size: 12px;
      letter-spacing: 0;
    }

    .job-table td {
      padding: 12px;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      background: #fff;
      vertical-align: middle;
    }

    .job-table td:first-child {
      border-left: 1px solid var(--line);
      border-radius: var(--radius) 0 0 var(--radius);
    }

    .job-table td:last-child {
      border-right: 1px solid var(--line);
      border-radius: 0 var(--radius) var(--radius) 0;
    }

    .job-table tbody tr:hover td {
      background: var(--surface-soft);
    }

    .job-table .cell-main {
      gap: 4px;
    }

    .job-table .cell-main strong {
      font-size: 16px;
      font-weight: 760;
      line-height: 1.25;
    }

    .job-table .cell-main span {
      color: #52616b;
      font-size: 13px;
    }

    .job-table td:nth-child(4) .cell-main strong {
      font-weight: 720;
    }

    .job-table .status-pill {
      min-width: 126px;
      gap: 4px;
    }

    .job-table .status-track {
      height: 7px;
      gap: 4px;
    }

    .job-table .status-pill span:last-child {
      font-size: 12px;
    }

    .job-table .badge {
      min-height: 28px;
      padding: 5px 9px;
      font-size: 12px;
    }

    .job-table .btn {
      min-height: 38px;
      padding: 8px 12px;
    }

    th:nth-child(5),
    td:nth-child(5),
    th:nth-child(6),
    td:nth-child(6) {
      width: 112px;
    }

    td:nth-child(5) .cell-main strong,
    td:nth-child(6) .cell-main strong {
      white-space: nowrap;
    }

    .cell-main {
      display: grid;
      gap: 3px;
      min-width: 0;
    }

    .action-due {
      justify-items: end;
      text-align: right;
    }

    .cell-main strong {
      color: var(--ink);
    }

    .cell-main span {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.35;
    }

    .route-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: var(--space-3);
    }

    .queue-filter {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      gap: var(--space-3);
      align-items: center;
      margin-bottom: var(--space-3);
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface-soft);
    }

    .queue-filter-label {
      color: var(--muted);
      font-size: 13px;
      font-weight: 850;
      white-space: nowrap;
    }

    .queue-filter .route-grid {
      gap: var(--space-2);
    }

    .route-card {
      width: 100%;
      color: inherit;
      font: inherit;
      text-align: left;
      cursor: pointer;
      border-left: 4px solid var(--accent);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-3);
      min-height: 96px;
    }

    .route-card:hover {
      background: var(--surface-soft);
    }

    .route-card:focus-visible {
      outline: 3px solid rgba(20, 95, 120, 0.22);
      outline-offset: 2px;
    }

    .route-card.active {
      background: var(--accent-soft);
      box-shadow: inset 0 0 0 1px var(--accent-line);
    }

    .route-card > .badge:first-child {
      min-height: 34px;
      padding: 7px 11px;
      font-size: 15px;
      font-weight: 850;
    }

    .route-card.warn {
      border-left-color: var(--warning-line);
    }

    .route-card.danger {
      border-left-color: var(--danger);
    }

    .route-card .route-count {
      display: block;
      color: var(--ink);
      font-size: 34px;
      font-weight: 800;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }

    .route-total {
      display: grid;
      justify-items: end;
      gap: 3px;
      text-align: right;
    }

    .route-card .route-unit {
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
      line-height: 1;
    }

    .queue-filter .route-card {
      min-height: 48px;
      padding: 8px 10px;
      background: var(--surface);
    }

    .queue-filter .route-card > .badge:first-child {
      min-height: 28px;
      padding: 5px 8px;
      font-size: 13px;
    }

    .queue-filter .route-card .route-count {
      font-size: 22px;
    }

    .queue-filter .route-card .route-unit {
      font-size: 12px;
    }

    .status-pill {
      display: inline-grid;
      min-width: 138px;
      gap: 5px;
    }

    .status-track {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 3px;
      width: 100%;
      height: 8px;
    }

    .status-dot {
      border-radius: 999px;
      background: #d7e2e6;
    }

    .status-dot.filled.level-1 {
      background: #a9ced9;
    }

    .status-dot.filled.level-2 {
      background: #78b3c4;
    }

    .status-dot.filled.level-3 {
      background: #438da3;
    }

    .status-dot.filled.level-4 {
      background: #1d6f89;
    }

    .status-dot.filled.level-5 {
      background: #0f5268;
    }

    .status-pill.lost .status-dot.filled {
      background: var(--muted);
    }

    .status-pill span:last-child {
      color: var(--ink);
      font-size: 13px;
      font-weight: 800;
      line-height: 1.2;
    }

    .job-list {
      display: none;
      gap: var(--space-2);
    }

    .job-card {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: var(--space-3);
    }

    .job-card-details {
      display: flex;
      flex-wrap: wrap;
      gap: var(--space-2);
      margin-top: var(--space-2);
    }

    .money-layout {
      display: grid;
      grid-template-columns: 1fr;
      gap: var(--space-4);
      align-items: stretch;
    }

    .data-layout {
      display: grid;
      grid-template-columns: minmax(0, 1.4fr) minmax(280px, .85fr);
      gap: var(--space-4);
      align-items: stretch;
    }

    .money-layout > .panel,
    .data-layout > .panel {
      height: 100%;
      margin-top: 0;
    }

    .money-controls {
      display: grid;
      grid-template-columns: minmax(180px, 1.3fr) minmax(140px, .75fr) minmax(140px, .75fr) minmax(150px, .85fr);
      gap: var(--space-2);
      margin-bottom: var(--space-4);
    }

    .data-actions {
      display: grid;
      gap: var(--space-3);
    }

    .data-status {
      display: grid;
      grid-template-columns: minmax(0, 1.25fr) minmax(220px, .75fr);
      gap: var(--space-3);
      margin-bottom: var(--space-4);
    }

    .data-status-card {
      padding: var(--space-4);
      border: 1px solid var(--line);
      border-left: 4px solid var(--accent);
      border-radius: var(--radius);
      background: var(--surface);
    }

    .data-status-card.warn {
      border-left-color: var(--warning-line);
      background: var(--warning-soft);
    }

    .data-status-card.success {
      border-left-color: var(--success);
      background: var(--success-soft);
    }

    .data-status-card .metric-label {
      font-size: 14px;
    }

    .data-status-card .metric-value {
      font-size: 40px;
    }

    .data-status-card.primary .metric-value {
      font-size: clamp(34px, 4vw, 52px);
      line-height: 1.05;
    }

    .data-recommendation {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: var(--space-4);
      align-items: center;
      margin-bottom: var(--space-4);
      padding: var(--space-4);
      border: 1px solid var(--warning-line);
      border-left: 5px solid var(--warning-line);
      border-radius: var(--radius);
      background: #fff8ea;
    }

    .data-recommendation h2 {
      margin-bottom: var(--space-1);
      font-size: 22px;
      line-height: 1.2;
    }

    .data-recommendation p {
      margin-bottom: 0;
    }

    .data-top-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) minmax(340px, 1.15fr);
      gap: var(--space-3);
      align-items: stretch;
      margin-bottom: var(--space-4);
    }

    .data-top-row > * {
      height: 100%;
      margin-bottom: 0;
    }

    .data-top-row .data-primary {
      margin-bottom: 0;
    }

    .data-top-row .data-primary.backup-hero {
      grid-template-columns: 1fr;
      align-content: start;
    }

    .data-top-row .data-primary .notice-actions {
      justify-content: flex-start;
    }

    .data-primary {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: var(--space-4);
      align-items: center;
      margin-bottom: var(--space-4);
      padding: var(--space-4);
      border: 1px solid var(--accent);
      border-left: 5px solid var(--accent);
      border-radius: var(--radius);
      background: var(--accent-soft);
    }

    .data-primary.backup-hero {
      grid-template-columns: minmax(0, 1fr) minmax(180px, auto);
      background: var(--warning-soft);
      border-color: var(--warning-line);
      border-left-color: var(--warning-line);
    }

    .data-primary h3 {
      margin-bottom: var(--space-1);
      font-size: 20px;
    }

    .data-primary p {
      margin-bottom: 0;
    }

    .data-primary .metric-note {
      margin-top: var(--space-3);
    }

    .data-tools-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: var(--space-3);
      align-items: stretch;
      margin-bottom: var(--space-4);
    }

    .data-secondary-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: var(--space-3);
      align-items: stretch;
    }

    .data-secondary-grid > * {
      height: 100%;
    }

    .data-danger-zone {
      padding: var(--space-4);
      border: 1px dashed #e6a2aa;
      border-radius: var(--radius);
      background: var(--surface);
    }

    .data-danger-zone h3 {
      margin-bottom: var(--space-1);
      font-size: 18px;
    }

    .data-danger-zone p {
      margin-bottom: var(--space-3);
    }

    .data-danger-zone .danger-note {
      color: var(--ink);
      font-weight: 400;
    }

    .data-facts {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: var(--space-2);
      margin-bottom: var(--space-3);
    }

    .data-action {
      display: grid;
      grid-template-rows: auto 1fr auto;
      align-content: start;
      padding: var(--space-4);
      border: 1px solid var(--line);
      border-left: 4px solid var(--accent);
      border-radius: var(--radius);
      background: var(--surface);
    }

    .data-action.data-danger-zone {
      border-color: #e6a2aa;
      border-left-color: var(--danger);
    }

    .btn.danger-outline {
      border-color: var(--danger);
      background: #fff;
      color: var(--ink);
    }

    .btn.danger-outline:hover {
      background: var(--danger-soft);
    }

    .data-action h3 {
      margin-bottom: var(--space-1);
      font-size: 18px;
    }

    .data-action p {
      margin-bottom: var(--space-3);
      font-size: 15px;
    }

    .data-action .btn {
      justify-self: start;
      align-self: end;
    }

    .data-action .notice-actions {
      align-self: end;
      justify-content: flex-start;
    }

    .data-tools-grid .data-action:not(.install) {
      min-height: 164px;
    }

    .data-action.install {
      border-left-color: var(--success);
      background: var(--success-soft);
    }

    .data-action.transfer {
      border-color: #a9cbe1;
      border-left-color: var(--info);
      background: var(--info-soft);
    }

    .data-action.transfer .install-card {
      border-color: #a9cbe1;
    }

    .install-options {
      display: grid;
      gap: var(--space-2);
    }

    .install-card {
      padding: var(--space-3);
      border: 1px solid #9fd4ad;
      border-radius: var(--radius);
      background: #fff;
    }

    .install-card strong {
      display: block;
      margin-bottom: var(--space-1);
    }

    .data-action ol {
      margin: var(--space-2) 0 0;
      padding-left: 20px;
      color: var(--muted);
      line-height: 1.45;
    }

    .empty {
      padding: var(--space-5);
      border: 1px dashed var(--line);
      border-radius: var(--radius);
      background: var(--surface-soft);
      text-align: center;
    }

    .empty strong {
      display: block;
      margin-bottom: var(--space-1);
      font-size: 18px;
    }

    .empty p {
      margin-bottom: 0;
    }

    .welcome {
      margin-bottom: var(--space-5);
      border-left: 4px solid var(--accent);
    }

    .welcome-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: var(--space-4);
      align-items: center;
    }

    .welcome h2 {
      margin-bottom: var(--space-2);
      font-size: 20px;
    }

    .welcome ul {
      margin: 0;
      padding-left: 18px;
      color: var(--muted);
      line-height: 1.45;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: none;
      align-items: center;
      justify-content: center;
      padding: var(--space-4);
      background: rgba(17, 19, 21, .36);
      overflow-x: hidden;
      overflow-y: auto;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-card {
      width: min(820px, 100%);
      max-height: min(92vh, 900px);
      overflow: auto;
      max-width: 100%;
      padding: var(--space-5);
      box-shadow: 0 18px 42px rgba(17, 19, 21, .18);
      overscroll-behavior: contain;
    }

    .modal-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: var(--space-3);
      margin-bottom: var(--space-4);
    }

    .modal-head h2 {
      margin-bottom: var(--space-1);
      font-size: 22px;
    }

    .modal-head p {
      margin-bottom: 0;
    }

    .form-grid {
      display: grid;
      gap: var(--space-3);
    }

    .form-section {
      display: grid;
      gap: var(--space-3);
      padding: var(--space-3);
      border: 1px solid #d2dde3;
      border-radius: var(--radius);
      background: var(--surface-soft);
    }

    .form-section h3 {
      margin: 0;
      color: #35454d;
      font-size: 14px;
      line-height: 1;
      text-transform: uppercase;
    }

    .form-section-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: var(--space-3);
    }

    .form-section-grid.money {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .field.full {
      grid-column: 1 / -1;
    }

    details {
      margin-top: var(--space-2);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface-soft);
    }

    summary {
      min-height: 44px;
      padding: 12px;
      color: var(--accent-strong);
      font-weight: 800;
      cursor: pointer;
    }

    .details-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: var(--space-3);
      padding: 0 var(--space-3) var(--space-3);
    }

    .modal-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: var(--space-2);
      margin-top: var(--space-5);
      padding-top: var(--space-4);
      border-top: 1px solid var(--line);
    }

    .save-actions {
      display: flex;
      flex-wrap: wrap;
      gap: var(--space-2);
      margin-left: auto;
    }

    .hidden-file {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
    }

    .bottom-nav {
      display: none;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .num {
      font-variant-numeric: tabular-nums;
    }

    @media (max-width: 1023px) {
      .app-shell {
        grid-template-columns: 1fr;
      }

      .sidebar {
        position: static;
        height: auto;
        padding: var(--space-3) var(--space-4);
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }

      .brand {
        display: flex;
        align-items: center;
        justify-content: flex-start;
        gap: var(--space-3);
        margin-bottom: var(--space-3);
        padding-bottom: var(--space-3);
      }

      .brand-title {
        font-size: 26px;
      }

      .nav {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }

      .nav button {
        display: flex;
        justify-content: center;
        text-align: center;
      }

      .main {
        padding: var(--space-5);
      }

      .topbar h1 {
        font-size: 30px;
      }

      .metric-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .summary-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      .route-grid,
      .money-layout,
      .data-layout {
        grid-template-columns: 1fr;
      }

      .data-status,
      .data-tools-grid,
      .data-secondary-grid {
        grid-template-columns: 1fr;
      }

      .controls {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .money-controls {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .welcome-grid {
        grid-template-columns: 1fr;
      }

      .notice {
        display: grid;
      }

      .queue-filter {
        grid-template-columns: 1fr;
      }

      .notice-actions {
        justify-content: flex-start;
      }
    }

    @media (max-width: 1180px) {
      .today-action {
        grid-template-columns: minmax(0, 1fr);
        align-items: start;
      }

      .today-action .action-meta {
        display: flex;
        flex-wrap: wrap;
      }

      .today-action .action-due {
        justify-items: start;
        text-align: left;
      }

      .today-action .action-due strong {
        overflow-wrap: anywhere;
      }

      .table-wrap {
        display: none;
      }

      .job-list {
        display: grid;
      }

      .job-card {
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: start;
      }

      .job-card .btn {
        min-width: 88px;
      }

      .controls {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .data-metric-grid,
      .data-tools-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .data-recommendation {
        grid-template-columns: minmax(0, 1fr);
        align-items: start;
      }

      .data-recommendation .notice-actions,
      .data-action .notice-actions {
        justify-content: flex-start;
      }

      .data-action {
        min-width: 0;
      }
    }

    @media (min-width: 1024px) {
      body {
        font-size: 17px;
      }

      .topbar h1 {
        font-size: 38px;
      }

      .topbar p {
        font-size: 17px;
      }

      .section-head h2 {
        font-size: 22px;
      }

      .section-head p,
      .data-action p {
        font-size: 16px;
      }

      .field label,
      th {
        font-size: 14px;
      }

      .badge,
      .cell-main span,
      .action-main span,
      .job-title span,
      .route-card span {
        font-size: 14px;
      }
    }

    @media (max-width: 719px) {
      body {
        padding-bottom: calc(92px + env(safe-area-inset-bottom));
      }

      .sidebar {
        display: none;
      }

      .main {
        padding: var(--space-4) var(--space-4) calc(112px + env(safe-area-inset-bottom));
      }

      .topbar {
        display: grid;
      }

      .topbar h1 {
        font-size: 28px;
      }

      .top-actions {
        grid-template-columns: minmax(0, 1fr) auto;
        justify-content: stretch;
      }

      .top-actions .btn {
        width: 100%;
      }

      .metric-grid,
      .metric-grid.compact,
      .summary-grid,
      .data-facts,
      .controls,
      .money-controls,
      .form-section-grid,
      .form-section-grid.money,
      .metric-grid.jobs-route-grid,
      .details-grid {
        grid-template-columns: 1fr;
      }

      .metric-value {
        font-size: 32px;
      }

      .metric-label {
        margin-bottom: 10px;
        font-size: 16px;
        font-weight: 850;
        line-height: 1.2;
      }

      .metric-note {
        font-size: 15px;
      }

      .action-item {
        grid-template-columns: 1fr;
      }

      .today-action {
        grid-template-columns: 1fr;
      }

      .action-due {
        justify-items: start;
        text-align: left;
      }

      .action-meta {
        align-items: flex-start;
      }

      .today-action .action-meta {
        display: flex;
        flex-wrap: wrap;
      }

      .table-wrap {
        display: none;
      }

      .route-grid {
        grid-template-columns: 1fr;
      }

      .job-card {
        grid-template-columns: 1fr;
      }

      .job-card .btn {
        width: 100%;
      }

      .data-actions {
        gap: var(--space-2);
      }

      .data-recommendation,
      .data-primary,
      .data-primary.backup-hero,
      .data-top-row {
        grid-template-columns: 1fr;
      }

      .data-recommendation .btn,
      .data-primary .btn {
        width: 100%;
      }

      .data-action {
        padding: var(--space-3);
      }

      .data-action h3 {
        font-size: 17px;
      }

      .data-action p {
        margin-bottom: var(--space-2);
        font-size: 14px;
      }

      .data-action .btn {
        width: 100%;
      }

      .modal-card {
        width: calc(100vw - 32px);
        max-height: calc(100vh - 32px);
        overflow-x: hidden;
        padding: var(--space-4);
      }

      .modal-actions {
        display: flex;
        flex-wrap: nowrap;
        width: 100%;
      }

      .save-actions {
        display: flex;
        width: 100%;
      }

      .save-actions {
        flex: 2 1 0;
        margin-left: 0;
      }

      .modal-actions .btn,
      .save-actions .btn {
        flex: 1 1 0;
        min-width: 0;
        padding-right: 8px;
        padding-left: 8px;
        font-size: 13px;
      }

      .bottom-nav {
        position: fixed;
        right: 0;
        bottom: 0;
        left: 0;
        z-index: 20;
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: var(--space-2);
        padding: 10px 22px calc(10px + env(safe-area-inset-bottom));
        border-top: 1px solid var(--line);
        background: #ffffff;
        box-shadow: 0 -14px 34px rgba(17, 19, 21, .16);
        isolation: isolate;
      }

      .bottom-nav button {
        display: grid;
        grid-template-rows: 36px auto;
        justify-items: center;
        align-content: center;
        gap: 4px;
        min-width: 0;
        min-height: 70px;
        padding: 6px 4px 8px;
        text-align: center;
        font-size: 13px;
      }

      .bottom-nav .tab-icon,
      .bottom-nav .tab-icon img {
        width: 36px;
        height: 36px;
      }

      .badge {
        white-space: normal;
      }

      .job-list {
        display: grid;
      }
    }

      function clone(obj) {

      function todayString() {
        return toDateInput(DATE_TODAY);
      }

      function toDateInput(date) {
        var year = date.getFullYear();
        var month = String(date.getMonth() + 1).padStart(2, "0");
        var day = String(date.getDate()).padStart(2, "0");
        return year + "-" + month + "-" + day;
      }

      function addDaysString(baseValue, days) {
        var date = parseLocalDate(baseValue || todayString()) || parseLocalDate(todayString());
        date.setDate(date.getDate() + days);
        return toDateInput(date);
      }

      function parseLocalDate(value) {
        if (!value || !/^\d{4}-\d{2}-\d{2}$/.test(value)) return null;
        var parts = value.split("-").map(Number);
        var date = new Date(parts[0], parts[1] - 1, parts[2]);
        if (date.getFullYear() !== parts[0] || date.getMonth() !== parts[1] - 1 || date.getDate() !== parts[2]) {
          return null;
        }
        return date;
      }

      function daysBetween(dateValue, baseValue) {
        var date = parseLocalDate(dateValue);
        var base = parseLocalDate(baseValue || todayString());
        if (!date || !base) return 0;
        return Math.floor((base.getTime() - date.getTime()) / 86400000);
      }

      function formatDate(value) {
        var date = parseLocalDate(value);
        if (!date) return "Not set";
        return date.toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" });
      }

      function formatMoney(value) {
        var amount = Number(value || 0);

      function numberValue(value) {
        var num = Number(value);

        if (["New Lead", "Waiting on Details"].indexOf(status) >= 0) return 1;
        if (["Estimate Needed", "Estimate Sent", "Follow-Up Needed"].indexOf(status) >= 0) return 2;
        if (["Scheduled", "In Progress", "Completed"].indexOf(status) >= 0) return 3;
        if (status === "Invoice Sent") return 4;
        if (status === "Paid" || status === "Closed/Lost") return 5;
        return Math.max(1, Math.min(5, Math.ceil((statusNumber(status) || 1) / statuses.length * 5)));
      }

      function statusPill(status) {

        }
        pill.appendChild(track);
        pill.appendChild(el("span", "", statusLabel(status)));
        return pill;
      }

      function createState(jobs, onboarded) {
        return {
          version: 1,
          jobs: jobs || [],
          meta: {
            onboarded: !!onboarded,
            lastBackupExportedAt: "",
            changesSinceLastBackup: 0,
            backupReminderDismissedAt: ""
          }
        };

      function isDemoMode() {
        return new URLSearchParams(window.location.search).get("demo") === "1";
      }

      function activeStorageKey() {
        return isDemoMode() ? DEMO_STORAGE_KEY : STORAGE_KEY;
      }

      function getDefaultState() {
        if (isDemoMode()) {
          return createState(getSampleJobs(), true);
        }
        return createState([], false);
      }

      function getSampleJobs() {
        return clone(sampleJobs);
      }

      function newId() {
        if (window.crypto && typeof window.crypto.randomUUID === "function") {
          return "job_" + window.crypto.randomUUID();
        }
        return "job_" + Date.now() + "_" + Math.random().toString(16).slice(2);
      }

      function loadState() {
        if (isDemoMode()) {
          state = getDefaultState();
          saveState(false);
          return;
        }
        try {
          var saved = localStorage.getItem(activeStorageKey());
          if (!saved) {
            state = getDefaultState();
            return;
          }
          var parsed = JSON.parse(saved);
          var result = validateState(parsed);
          if (!result.ok) {
            recoveryMode = true;
            rawCorruptedState = saved;
            state = createState([], false);
            storageWarning = "Your saved data could not be loaded. Your current file was not changed. You can export the unreadable data for support, import a backup, or reset this browser.";
            return;
          }
          state = normalizeState(parsed);
        } catch (error) {
          recoveryMode = true;
          try {
            rawCorruptedState = localStorage.getItem(activeStorageKey()) || "";
          } catch (readError) {
            rawCorruptedState = "";
          }
          state = createState([], false);
          storageWarning = "Your saved data could not be loaded. Your current file was not changed. You can import a backup or reset this browser.";
        }
      }

      function saveState(countChange) {
        if (!state || recoveryMode) return false;
        if (countChange) {
          state.meta.changesSinceLastBackup = numberValue(state.meta.changesSinceLastBackup) + 1;
        }
        try {
          localStorage.setItem(activeStorageKey(), JSON.stringify(state));
          storageWarning = "";
          return true;
        } catch (error) {
          storageWarning = "This browser is blocking local storage. JobDue may not be able to save changes here. Try a normal Chrome, Edge, or Safari window, then export a backup after adding jobs.";
          render();
          return false;
        }
      }

      function normalizeState(input) {
        var clean = createState([], true);
        clean.version = 1;
        clean.jobs = input.jobs.map(normalizeJob);
        clean.meta = Object.assign(clean.meta, input.meta || {});
        clean.meta.changesSinceLastBackup = numberValue(clean.meta.changesSinceLastBackup);
        clean.meta.onboarded = clean.jobs.length ? true : !!clean.meta.onboarded;
        return clean;
      }

      function normalizeJob(job) {
        var now = new Date().toISOString();
        var paymentStatus = normalizePaymentStatus(job.paymentStatus);
        var clean = {
          id: String(job.id || newId()),
          createdAt: String(job.createdAt || now),
          updatedAt: String(job.updatedAt || now),
          clientName: String(job.clientName || ""),
          phone: String(job.phone || ""),

          reviewRequestDate: String(job.reviewRequestDate || ""),
          reviewReceived: !!job.reviewReceived,

        return applyPaymentProgressRules(clean);
      }

      function normalizePaymentStatus(status) {
        if (status === "Not Sent") return "Invoice Needed";
        return paymentStatuses.indexOf(status) >= 0 ? status : "Invoice Needed";
      }

      function isReviewNextAction(text) {
        return /review/i.test(String(text || ""));
      }

      function isBeforeInvoiceSent(status) {
        var invoiceStep = statusNumber("Invoice Sent");
        var currentStep = statusNumber(status);
        return currentStep > 0 && currentStep < invoiceStep;
      }

      function applyPaymentProgressRules(job) {
        var invoiceAmount = numberValue(job.invoiceAmount);
        var amountPaid = numberValue(job.amountPaid);
        var dueAmount = Math.max(invoiceAmount - amountPaid, 0);
        var currentPayment = normalizePaymentStatus(job.paymentStatus);

        if (invoiceAmount <= 0) {
          if (isBeforeInvoiceSent(job.status) && !job.invoiceSentDate && amountPaid <= 0) {
            job.paymentStatus = "Invoice Needed";
            return job;
          }
          job.paymentStatus = amountPaid > 0 ? "Paid" : currentPayment;
          return job;
        }

        if (dueAmount <= 0 && amountPaid > 0) {
          job.paymentStatus = "Paid";
          job.status = "Paid";
          if (!job.completedDate) job.completedDate = todayString();
          if (!job.reviewReceived) {
            job.nextAction = job.reviewRequested ? (job.nextAction || "Check for review") : "Ask for review";
            job.nextActionDate = job.reviewRequested ? (job.nextActionDate || todayString()) : todayString();
            if (!job.reviewRequested) job.followUpDate = addDaysString(todayString(), 7);
          }
          return job;
        }

        if (amountPaid > 0 && dueAmount > 0) {
          job.paymentStatus = "Partially Paid";
          if (job.status === "Paid") job.status = "Invoice Sent";
          if (!job.nextAction || isReviewNextAction(job.nextAction)) job.nextAction = "Collect remaining balance";
          if (!job.nextActionDate && job.dueDate) job.nextActionDate = job.dueDate;
          return job;
        }

        if (isBeforeInvoiceSent(job.status) && !job.invoiceSentDate) {
          job.paymentStatus = "Invoice Needed";
          return job;
        }

        if (job.dueDate && parseLocalDate(job.dueDate) < parseLocalDate(todayString())) {
          job.paymentStatus = "Overdue";
        } else if (currentPayment === "Paid" || currentPayment === "Partially Paid" || currentPayment === "Overdue") {
          job.paymentStatus = job.invoiceSentDate ? "Invoice Sent" : "Invoice Needed";
        } else {
          job.paymentStatus = currentPayment;
        }
        return job;
      }

      function validateState(input) {
        if (!input || typeof input !== "object") return { ok: false, message: "This backup file could not be read. Your current data was not changed." };
        if (input.version !== 1) return { ok: false, message: "This backup version is not supported. Your current data was not changed." };
        if (!Array.isArray(input.jobs)) return { ok: false, message: "This backup does not include a jobs list. Your current data was not changed." };
        var seen = {};
        for (var i = 0; i < input.jobs.length; i += 1) {
          var job = input.jobs[i];
          if (!job || typeof job !== "object") return { ok: false, message: "This backup includes a job that could not be read. Your current data was not changed." };
          if (!job.id || seen[job.id]) return { ok: false, message: "This backup has duplicate or missing job IDs. Your current data was not changed." };
          seen[job.id] = true;
          if (!job.clientName || !job.jobType || !job.status) return { ok: false, message: "This backup is missing required job fields. Your current data was not changed." };
          if (statuses.indexOf(job.status) < 0) return { ok: false, message: "This backup includes an unsupported job status. Your current data was not changed." };
          var dateFields = ["nextActionDate", "jobDate", "estimateSentDate", "invoiceSentDate", "dueDate", "followUpDate", "completedDate", "reviewRequestDate"];
          for (var d = 0; d < dateFields.length; d += 1) {
            var val = job[dateFields[d]];
            if (val && !parseLocalDate(String(val))) {
              return { ok: false, message: "This backup has an invalid date. Your current data was not changed." };
            }
          }
          var numericFields = ["estimateAmount", "invoiceAmount", "amountPaid"];
          for (var n = 0; n < numericFields.length; n += 1) {
            var numericValue = job[numericFields[n]];
            if (numericValue === undefined || numericValue === null || numericValue === "") continue;
            var parsedNumber = Number(numericValue);
            if (!Number.isFinite(parsedNumber) || parsedNumber < 0) {
              return { ok: false, message: "This backup has an invalid money amount. Your current data was not changed." };
            }
          }
        }
        return { ok: true, message: "" };
      }

      function balanceDue(job) {
        return Math.max(numberValue(job.invoiceAmount) - numberValue(job.amountPaid), 0);
      }

      function daysOverdue(job) {
        if (!job.dueDate || balanceDue(job) <= 0) return 0;
        return Math.max(daysBetween(job.dueDate), 0);
      }

      function isOverdue(job) {
        return daysOverdue(job) > 0;
      }

      function isFollowUpDue(job) {
        if (!job.followUpDate) return false;
        return parseLocalDate(job.followUpDate) <= parseLocalDate(todayString());
      }

      function isDueThisWeek(job) {
        if (!job.followUpDate) return false;
        var diff = -daysBetween(job.followUpDate);
        return diff >= 0 && diff <= 7;
      }

      function isJobScheduledThisWeek(job) {
        if (!job.jobDate) return false;
        var diff = -daysBetween(job.jobDate);
        return diff >= 0 && diff <= 7;
      }

      function hasFutureWorkDate(job) {
        return ["jobDate", "nextActionDate", "followUpDate"].some(function (key) {
          return job[key] && parseLocalDate(job[key]) > parseLocalDate(todayString());
        });
      }

      function needsReview(job) {
        return job.completedDate && balanceDue(job) === 0 && !job.reviewReceived && (!job.reviewRequested || job.reviewRequestDate);
      }

      function getMetrics() {
        var jobs = state.jobs;
        var paid = jobs.reduce(function (sum, job) { return sum + numberValue(job.amountPaid); }, 0);
        var unpaid = jobs.reduce(function (sum, job) { return sum + balanceDue(job); }, 0);
        var overdue = jobs.reduce(function (sum, job) { return sum + (isOverdue(job) ? balanceDue(job) : 0); }, 0);
        var followUps = jobs.filter(isFollowUpDue).length;
        var reviewRequests = jobs.filter(function (job) {
          return job.completedDate && balanceDue(job) === 0 && !job.reviewRequested && !job.reviewReceived;
        }).length;
        var invoiceJobs = jobs.filter(function (job) { return numberValue(job.invoiceAmount) > 0 && balanceDue(job) > 0; }).length;
        var openLeads = jobs.filter(function (job) { return statusNumber(job.status) > 0 && statusNumber(job.status) < 6; }).length;
        var estimatesSent = jobs.filter(function (job) { return job.status === "Estimate Sent"; }).length;
        return {
          paid: paid,
          unpaid: unpaid,
          overdue: overdue,
          followUps: followUps,
          reviewRequests: reviewRequests,
          invoiceJobs: invoiceJobs,
          openLeads: openLeads,
          estimatesSent: estimatesSent
        };
      }

      function setText(el, text) {
        el.textContent = text == null ? "" : String(text);
        return el;
      }

      function el(tag, className, text) {
        var node = document.createElement(tag);
        if (className) node.className = className;
        if (text !== undefined) node.textContent = text;
        return node;
      }

      function button(label, className, action, value) {
        var node = el("button", className || "btn", label);
        node.type = "button";
        if (action) node.dataset.action = action;
        if (value) node.dataset.value = value;
        node.title = tooltipForAction(action, label);
        node.setAttribute("aria-label", label);
        return node;
      }

      function tooltipForAction(action, label) {
        var tips = {
          "set-tab": "Open the " + label + " view.",
          "new-job": "Add a new lead or job.",
          "export-backup": "Download a backup you can restore or move to another device.",
          "choose-import": "Choose a backup file and preview it before replacing current jobs.",
          "export-csv": "Download job data for spreadsheet review.",
          "dismiss-backup": "Hide this backup reminder until later.",
          "reload-sample": "Replace current jobs with the smaller sample data set.",
          "reset-data": "Clear jobs saved in this browser after confirmation.",
          "edit-job": "Edit this job.",
          "set-route-filter": "Filter the Jobs list by this work queue.",
          "show-jobs-preset": "Open Jobs with the matching filter applied.",
          "set-money-preset": "Filter the Money list by this total.",
          "use-sample": "Load the sample jobs so you can try the app.",
          "start-blank": "Start with no jobs saved.",
          "close-job-modal": "Close this form without saving.",
          "close-import-modal": "Close this import preview."
        };
        return tips[action] || label;
      }

      function badge(text, tone) {
        var node = el("span", "badge" + (tone ? " " + tone : ""), text);
        node.title = text;
        return node;
      }

      function renderNav() {
        var sideNav = document.getElementById("sideNav");
        var bottomNav = document.getElementById("bottomNav");
        sideNav.textContent = "";
        bottomNav.textContent = "";
        TABS.forEach(function (tab) {
          var sideButton = button(tab, activeTab === tab ? "active" : "", "set-tab", tab);
          var bottomButton = button(tab, activeTab === tab ? "active" : "", "set-tab", tab);
          decorateTabButton(sideButton, tab);
          decorateTabButton(bottomButton, tab);
          sideNav.appendChild(sideButton);
          bottomNav.appendChild(bottomButton);
        });
      }

      function decorateTabButton(node, tab) {
        node.textContent = "";
        var icon = el("span", "tab-icon");
        var img = document.createElement("img");
        img.src = TAB_ICONS[tab] || "";
        img.alt = "";
        img.setAttribute("aria-hidden", "true");
        icon.appendChild(img);
        node.appendChild(icon);
        node.appendChild(el("span", "tab-label", tab));
      }

      function render() {
        renderNav();
        var app = document.getElementById("app");
        app.textContent = "";

        if (recoveryMode) {
          app.appendChild(renderRecovery());
          return;
        }

        if (!state.meta.onboarded) {
          app.appendChild(renderWelcome());
        }

        if (storageWarning) {
          app.appendChild(renderNotice("Storage warning", storageWarning, "danger"));
        }

        app.appendChild(renderTopbar());

        if (activeTab === "Today") app.appendChild(renderToday());
        if (activeTab === "Jobs") app.appendChild(renderJobs());
        if (activeTab === "Money") app.appendChild(renderMoney());
        if (activeTab === "Data") app.appendChild(renderData());
      }

      function renderTopbar() {
        var wrap = el("div", "topbar");
        var copy = el("div", "top-title");
        copy.appendChild(el("h1", "", activeTab));
        var help = "Follow up and collect what is due today.";
        if (activeTab === "Jobs") help = "Find, filter, and update contractor jobs.";
        if (activeTab === "Money") help = "Track unpaid, overdue, and paid work.";
        if (activeTab === "Data") help = "Back up, restore, export, and install.";
        copy.appendChild(helpTip(help));
        wrap.appendChild(copy);
        var actions = el("div", "top-actions");
        if (activeTab === "Today") {
          actions.appendChild(el("div", "top-date", formatDate(todayString())));

          wrap.appendChild(actions);
        }
        if (activeTab === "Jobs") {
          actions.appendChild(button("Add Job", "btn", "new-job"));
          wrap.appendChild(actions);
        }
        return wrap;
      }

      function helpTip(text) {
        var wrap = el("span", "help-wrap");
        var tip = el("button", "help-tip", "?");
        var popover = el("span", "help-popover", text);
        tip.type = "button";
        tip.setAttribute("aria-label", text);
        tip.setAttribute("aria-expanded", "false");
        tip.dataset.action = "toggle-help";
        popover.hidden = true;
        wrap.appendChild(tip);
        wrap.appendChild(popover);
        return wrap;
      }

      function renderWelcome() {
        var panel = el("section", "panel welcome");
        var grid = el("div", "welcome-grid");
        var copy = el("div");
        copy.appendChild(el("h2", "", "Start with sample jobs or your own tracker"));
        var list = el("ul");
        [
          "This is an offline browser app.",
          "Data is saved in this browser on this device.",
