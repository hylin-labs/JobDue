      }

      function renderRecovery() {
        var wrap = el("div");
        var notice = renderNotice("Saved data needs attention", storageWarning, "danger");
        var actions = el("div", "notice-actions");
        actions.appendChild(button("Import Backup", "btn", "choose-import"));
        actions.appendChild(button("Export Unreadable Data", "btn secondary", "export-raw"));
        actions.appendChild(button("Reset This Browser", "btn danger", "reset-data"));
        notice.appendChild(actions);
        wrap.appendChild(notice);
        return wrap;
      }

      function renderNotice(title, message, tone) {
        var notice = el("section", "notice" + (tone ? " " + tone : ""));
        var copy = el("div");
        copy.appendChild(el("h2", "", title));
        copy.appendChild(el("p", "", message));
        notice.appendChild(copy);
        return notice;
      }

      function shouldShowBackupReminder() {
        if (!state.meta.onboarded) return false;
        if (state.meta.backupReminderDismissedAt) {
          var dismissed = new Date(state.meta.backupReminderDismissedAt);
          if (!Number.isNaN(dismissed.getTime())) {
            var dismissedDays = Math.floor((Date.now() - dismissed.getTime()) / 86400000);
            if (dismissedDays < 1) return false;
          }
        }
        var changes = numberValue(state.meta.changesSinceLastBackup);
        if (changes >= 25) return true;
        if (!state.meta.lastBackupExportedAt) return true;
        var last = new Date(state.meta.lastBackupExportedAt);
        if (Number.isNaN(last.getTime())) return true;
        var days = Math.floor((Date.now() - last.getTime()) / 86400000);
        return days >= 7;
      }

      function renderBackupReminder() {
        var notice = renderNotice("Backup recommended", "Your jobs are saved in this browser. Export a backup so you can recover them later.", "warning");
        var actions = el("div", "notice-actions");
        actions.appendChild(button("Export Backup", "btn", "export-backup"));
        actions.appendChild(button("Remind Me Later", "btn secondary", "dismiss-backup"));
        notice.appendChild(actions);
        return notice;
      }

      function renderToday() {
        var wrap = el("div");
        var metrics = getMetrics();
        wrap.appendChild(renderMetricGrid([
          ["Collect today", formatMoney(metrics.overdue || metrics.unpaid), "Due money", "money", "show-jobs-preset", "collectToday"],
          ["Follow-ups due", String(metrics.followUps), "Due now", metrics.followUps ? "warn" : "", "show-jobs-preset", "followUpsDue"],
          ["Review requests", String(metrics.reviewRequests), "Ask next", metrics.reviewRequests ? "success" : "", "show-jobs-preset", "reviewRequests"],
          ["Unpaid balance", formatMoney(metrics.unpaid), "Open", "", "show-jobs-preset", "unpaidBalance"]
        ]));

        var actions = getTodayActions();
        var panel = el("section", "panel section");
        var head = sectionHead("Today list");
        panel.appendChild(head);
        if (!actions.length) {
          panel.appendChild(emptyState("Nothing needs attention today.", "You can add a job, review upcoming work, or export a backup."));
        } else {
          var ledger = el("div", "ledger");
          actions.forEach(function (item) {
            ledger.appendChild(renderActionItem(item));
          });
          panel.appendChild(ledger);
        }
        wrap.appendChild(panel);
        wrap.appendChild(renderThisWeekSummary(metrics));
        return wrap;
      }

      function renderThisWeekSummary(metrics) {
        var upcoming = state.jobs.filter(function (job) { return isJobScheduledThisWeek(job); }).length;
        var panel = el("section", "panel section");
        panel.appendChild(sectionHead("This week"));
        var grid = el("div", "metric-grid jobs-route-grid");
        grid.appendChild(summaryCard(String(metrics.openLeads), "Open leads and estimates", "openLeads"));
        grid.appendChild(summaryCard(String(metrics.invoiceJobs), "Jobs with money still due", "invoiceJobs"));
        grid.appendChild(summaryCard(String(upcoming), "Scheduled in the next 7 days", "scheduledWeek"));
        panel.appendChild(grid);
        return panel;
      }

      function summaryCard(value, label, preset) {
        var card = el(preset ? "button" : "article", "metric" + (preset ? " route-filter-card" : ""));
        if (preset) {
          card.type = "button";
          card.dataset.action = "show-jobs-preset";
          card.dataset.value = preset;
          card.title = tooltipForAction("show-jobs-preset", label);
          card.setAttribute("aria-label", "Show " + label + " in Jobs");
        }
        card.appendChild(el("span", "metric-label", label));
        card.appendChild(el("span", "metric-value", value));
        card.appendChild(el("span", "metric-note", value === "1" ? "job" : "jobs"));
        return card;
      }

      function getTodayActions() {
        var items = [];
        state.jobs.forEach(function (job) {
          if (isOverdue(job)) {
            items.push({ type: "Collect", job: job, tone: "danger", due: job.dueDate, money: balanceDue(job), action: "Collect " + formatMoney(balanceDue(job)) });
          }
        });
        state.jobs.forEach(function (job) {
          if (isFollowUpDue(job) && !isOverdue(job)) {
            items.push({ type: "Follow up", job: job, tone: "warn", due: job.followUpDate, money: balanceDue(job), action: job.nextAction || "Follow up" });
          }
        });
        state.jobs.forEach(function (job) {
          if (job.completedDate && balanceDue(job) === 0 && !job.reviewRequested && !job.reviewReceived) {
            items.push({ type: "Review", job: job, tone: "success", due: job.completedDate, money: 0, action: "Ask for review" });
          }
        });
        return items.slice(0, 12);
      }

      function renderActionItem(item) {
        var node = el("article", "action-item today-action");
        var main = el("div", "action-main");
        main.appendChild(el("strong", "", item.job.clientName));
        main.appendChild(el("span", "", item.job.jobType));
        node.appendChild(main);
        var meta = el("div", "action-meta");
        meta.appendChild(badge(item.type, item.tone));
        meta.appendChild(badge(statusLabel(item.job.status), "accent"));
        meta.appendChild(el("span", "amount", item.money ? formatMoney(item.money) : formatDate(item.due)));
        node.appendChild(meta);
        var right = el("div", "cell-main action-due");
        right.appendChild(el("strong", "", item.action));
        right.appendChild(el("span", "", "Due " + formatDate(item.due)));
        node.appendChild(right);
        return node;
      }

      function renderJobs() {
        var wrap = el("div");
        wrap.appendChild(renderRoute());
        var panel = el("section", "panel section");
        panel.appendChild(sectionHead("Jobs - " + routeFilter));
        panel.appendChild(renderControls());
        var jobs = getFilteredJobs();
        if (!jobs.length) {
          panel.appendChild(emptyState("No jobs match this view.", "Clear filters or add a new job."));
        } else {
          panel.appendChild(renderJobTable(jobs));
          panel.appendChild(renderJobCards(jobs));
        }
        wrap.appendChild(panel);
        return wrap;
      }

      function renderRoute() {
        var overdue = state.jobs.filter(function (job) { return routeMatches(job, "Do Now"); });
        var current = state.jobs.filter(function (job) { return routeMatches(job, "Active Work"); });
        var upcoming = state.jobs.filter(function (job) { return routeMatches(job, "Prepare Next"); });
        var grid = el("section", "metric-grid jobs-route-grid");
        grid.appendChild(routeCard("Do Now", overdue.length, "danger"));
        grid.appendChild(routeCard("Active Work", current.length, ""));
        grid.appendChild(routeCard("Prepare Next", upcoming.length, "warn"));
        return grid;
      }

      function routeCard(label, count, tone) {
        var isActive = routeFilter === label;
        var card = el("button", "metric route-filter-card" + (tone ? " " + tone : "") + (isActive ? " active" : ""));
        card.type = "button";
        card.dataset.action = "set-route-filter";
        card.dataset.value = label;
        card.setAttribute("aria-pressed", isActive ? "true" : "false");
        card.setAttribute("aria-label", "Show " + label + " jobs");
        card.appendChild(el("span", "metric-label", label));
        card.appendChild(el("span", "metric-value", String(count)));
        card.appendChild(el("span", "metric-note", count === 1 ? "job" : "jobs"));
        if (isActive) card.appendChild(el("span", "route-selected-badge", "Selected"));
        return card;
      }

      function routeMatches(job, route) {
        if (route === "Do Now") return isOverdue(job) || isFollowUpDue(job);
        if (route === "Active Work") {
          return ["Scheduled", "In Progress", "Completed", "Invoice Sent"].indexOf(job.status) >= 0 && !routeMatches(job, "Do Now") && !routeMatches(job, "Prepare Next");
        }
        if (route === "Prepare Next") {
          return ["Paid", "Closed/Lost"].indexOf(job.status) < 0 && hasFutureWorkDate(job);
        }
        return true;
      }

      function resetJobFilters() {
        filters = {
          search: "",
          status: "All",
          payment: "All",
          follow: "All",
          sort: "followUp"
        };
        routeFilter = "All";
      }

      function setRouteFilter(value) {
        var nextRoute = routeFilter === value ? "All" : value;
        var currentSort = filters.sort;
        filters.search = "";
        filters.status = "All";
        filters.payment = "All";
        filters.follow = "All";
        filters.sort = currentSort;
        routeFilter = nextRoute;
        render();
      }

      function showJobsPreset(preset) {
        resetJobFilters();
        if (preset === "collectToday") {
          filters.follow = getMetrics().overdue ? "Overdue Invoice" : "Balance Due";
          filters.sort = "balance";
        }
        if (preset === "followUpsDue") filters.follow = "Due";
        if (preset === "reviewRequests") {
          filters.follow = "Review Needed";
          filters.sort = "oldest";
        }
        if (preset === "unpaidBalance" || preset === "invoiceJobs") {
          filters.follow = "Balance Due";
          filters.sort = "balance";
        }
        if (preset === "openLeads") filters.follow = "Open Leads";
        if (preset === "scheduledWeek") {
          filters.follow = "Scheduled This Week";
          filters.sort = "oldest";
        }
        activeTab = "Jobs";
        render();
      }

      function renderControls() {
        var controls = el("div", "controls");
        controls.appendChild(inputField("Search", "search", filters.search, "text", "Client, phone, job, notes"));
        controls.appendChild(selectField("Status", "status", ["All"].concat(statuses), filters.status));
        controls.appendChild(selectField("Payment", "payment", ["All"].concat(paymentStatuses), filters.payment));
        controls.appendChild(selectField("Focus", "follow", [
          "All",
          ["Due", "Follow-up due"],
          "This Week",
          "Overdue Invoice",
          "Balance Due",
          "Review Needed",
          "Open Leads",
          "Scheduled This Week"
        ], filters.follow));
        controls.appendChild(selectField("Sort", "sort", [
          ["followUp", "Follow-up date"],
          ["dueDate", "Invoice due date"],
          ["balance", "Balance due"],
          ["status", "Status step"],
          ["newest", "Newest"],
          ["oldest", "Oldest"]
        ], filters.sort));
        return controls;
      }

      function inputField(labelText, id, value, type, placeholder, filterKind) {
        var field = el("div", "field");
        var label = el("label", "", labelText);
        label.setAttribute("for", id);
        var input = document.createElement("input");
        input.id = id;
        input.type = type;
        input.value = value || "";
        if (placeholder) input.placeholder = placeholder;
        input.dataset[filterKind || "filter"] = id;
        field.appendChild(label);
        field.appendChild(input);
        return field;
      }

      function selectField(labelText, id, options, value, filterKind) {
        var field = el("div", "field");
        var label = el("label", "", labelText);
        label.setAttribute("for", id);
        var select = document.createElement("select");
        select.id = id;
        select.dataset[filterKind || "filter"] = id;
        options.forEach(function (option) {
          var opt = document.createElement("option");
          if (Array.isArray(option)) {
            opt.value = option[0];
            opt.textContent = option[1];
          } else {
            opt.value = option;
            opt.textContent = option;
          }
          if (opt.value === value) opt.selected = true;
          select.appendChild(opt);
        });
        field.appendChild(label);
        field.appendChild(select);
        return field;
      }

      function getFilteredJobs() {
        var list = state.jobs.slice();
        var query = filters.search.trim().toLowerCase();
        if (query) {
          list = list.filter(function (job) {
            return [job.clientName, job.jobType, job.phone, job.email, job.serviceAddress, job.notes].join(" ").toLowerCase().indexOf(query) >= 0;
          });
        }
        if (filters.status !== "All") list = list.filter(function (job) { return job.status === filters.status; });
        if (filters.payment !== "All") list = list.filter(function (job) { return job.paymentStatus === filters.payment; });
        if (filters.follow === "Due") list = list.filter(isFollowUpDue);
        if (filters.follow === "This Week") list = list.filter(isDueThisWeek);
        if (filters.follow === "Overdue Invoice") list = list.filter(isOverdue);
        if (filters.follow === "Balance Due") list = list.filter(function (job) { return balanceDue(job) > 0; });
        if (filters.follow === "Review Needed") list = list.filter(function (job) { return job.completedDate && balanceDue(job) === 0 && !job.reviewRequested && !job.reviewReceived; });
        if (filters.follow === "Open Leads") list = list.filter(function (job) { return statusNumber(job.status) > 0 && statusNumber(job.status) < 6; });
        if (filters.follow === "Scheduled This Week") list = list.filter(isJobScheduledThisWeek);
        if (routeFilter !== "All") list = list.filter(function (job) { return routeMatches(job, routeFilter); });
        list.sort(sortJobs);
        return list;
      }

      function sortJobs(a, b) {
        if (filters.sort === "balance") return balanceDue(b) - balanceDue(a);
        if (filters.sort === "status") return statusNumber(a.status) - statusNumber(b.status);
        if (filters.sort === "newest") return String(b.createdAt).localeCompare(String(a.createdAt));
        if (filters.sort === "oldest") return String(a.createdAt).localeCompare(String(b.createdAt));
        if (filters.sort === "dueDate") return String(a.dueDate || "9999-99-99").localeCompare(String(b.dueDate || "9999-99-99"));
        return String(a.followUpDate || a.nextActionDate || "9999-99-99").localeCompare(String(b.followUpDate || b.nextActionDate || "9999-99-99"));
      }

      function renderJobTable(jobs) {
        var wrap = el("div", "table-wrap");
        var table = document.createElement("table");
        table.className = "job-table";
        var thead = document.createElement("thead");
        var header = document.createElement("tr");
        ["Client", "Job", "Status", "Next Action", "Follow-up", "Balance", "Payment", "Actions"].forEach(function (text) {
          header.appendChild(el("th", "", text));
        });
        thead.appendChild(header);
        table.appendChild(thead);
        var tbody = document.createElement("tbody");
        jobs.forEach(function (job) {
          var row = document.createElement("tr");
          row.appendChild(tableCell(job.clientName, job.phone || job.email));
          row.appendChild(tableCell(job.jobType, job.serviceAddress));
          var statusCell = document.createElement("td");
          statusCell.appendChild(statusPill(job.status));
          row.appendChild(statusCell);
          row.appendChild(tableCell(job.nextAction || "No next action", job.nextActionDate ? formatDate(job.nextActionDate) : ""));
          row.appendChild(tableCell(formatDate(job.followUpDate), followUpStatus(job)));
          row.appendChild(tableCell(formatMoney(balanceDue(job)), overdueLabel(job)));
          var payCell = document.createElement("td");
          payCell.appendChild(badge(job.paymentStatus, isOverdue(job) ? "danger" : job.paymentStatus === "Paid" ? "success" : ""));
          row.appendChild(payCell);
          var actionCell = document.createElement("td");
          actionCell.appendChild(button("Edit", "btn secondary", "edit-job", job.id));
          row.appendChild(actionCell);
          tbody.appendChild(row);
        });
        table.appendChild(tbody);
        wrap.appendChild(table);
        return wrap;
      }

      function tableCell(mainText, subText) {
        var cell = document.createElement("td");
        var main = el("div", "cell-main");
        main.appendChild(el("strong", "", mainText || "Not set"));
        if (subText) main.appendChild(el("span", "", subText));
        cell.appendChild(main);
        return cell;
      }

      function infoBlock(mainText, subText) {
        var main = el("div", "cell-main");
        main.appendChild(el("strong", "", mainText || "Not set"));
        if (subText) main.appendChild(el("span", "", subText));
        return main;
      }

      function followUpStatus(job) {
        if (!job.followUpDate) return "";
        if (isFollowUpDue(job)) return "Today";
        if (isDueThisWeek(job)) return "This week";
        return "";
      }

      function overdueLabel(job) {
        var days = daysOverdue(job);
        if (!days) return "";
        return days + "d late";
      }

      function renderJobCards(jobs) {
        var list = el("div", "job-list");
        jobs.forEach(function (job) {
          var card = el("article", "job-card");
          var copy = el("div");
          var title = el("div", "job-title");
          title.appendChild(el("strong", "", job.clientName));
          title.appendChild(el("span", "", job.jobType));
          copy.appendChild(title);
          var details = el("div", "job-card-details");
          details.appendChild(statusPill(job.status));
          details.appendChild(badge(job.paymentStatus, isOverdue(job) ? "danger" : job.paymentStatus === "Paid" ? "success" : ""));
          details.appendChild(badge("Follow-up " + formatDate(job.followUpDate), isFollowUpDue(job) ? "warn" : ""));
          if (balanceDue(job) > 0) details.appendChild(badge(formatMoney(balanceDue(job)) + " open", isOverdue(job) ? "danger" : ""));
          copy.appendChild(details);
          if (job.nextAction) copy.appendChild(el("p", "", job.nextAction));
          card.appendChild(copy);
          card.appendChild(button("Edit", "btn secondary", "edit-job", job.id));
          list.appendChild(card);
        });
        return list;
      }

      function renderMoney() {
        var wrap = el("div");
        var metrics = getMetrics();

      function getMoneyJobs() {
        var list = state.jobs.filter(function (job) {
          return balanceDue(job) > 0 || numberValue(job.invoiceAmount) > 0 || numberValue(job.amountPaid) > 0;
        });
        var query = moneyFilters.search.trim().toLowerCase();
        if (query) {
          list = list.filter(function (job) {
            return [job.clientName, job.jobType, job.phone, job.email, job.paymentMethod, job.notes].join(" ").toLowerCase().indexOf(query) >= 0;
          });
        }
        if (moneyFilters.view === "Unpaid") list = list.filter(function (job) { return balanceDue(job) > 0; });
        if (moneyFilters.view === "Overdue") list = list.filter(isOverdue);
        if (moneyFilters.view === "InvoiceJobs") list = list.filter(function (job) { return numberValue(job.invoiceAmount) > 0 && balanceDue(job) > 0; });
        if (moneyFilters.view === "Paid") list = list.filter(function (job) { return numberValue(job.amountPaid) > 0 && balanceDue(job) === 0; });
        if (moneyFilters.payment !== "All") list = list.filter(function (job) { return job.paymentStatus === moneyFilters.payment; });
        list.sort(sortMoneyJobs);
        return list;
      }

      function sortMoneyJobs(a, b) {
        if (moneyFilters.sort === "dueDate") return String(a.dueDate || "9999-99-99").localeCompare(String(b.dueDate || "9999-99-99"));
        if (moneyFilters.sort === "invoice") return numberValue(b.invoiceAmount) - numberValue(a.invoiceAmount);
        if (moneyFilters.sort === "paid") return numberValue(b.amountPaid) - numberValue(a.amountPaid);
        if (moneyFilters.sort === "client") return String(a.clientName).localeCompare(String(b.clientName));
        return balanceDue(b) - balanceDue(a);
      }

      function attachStatusFormSync() {
        var form = document.getElementById("jobForm");
        if (!form || !form.elements.status) return;
        var statusInput = form.elements.status;
        statusInput.addEventListener("change", function () {
          var nextAction = nextActionForStatus(statusInput.value);
          if (form.elements.nextAction) form.elements.nextAction.value = nextAction;
          if (form.elements.nextActionDate) form.elements.nextActionDate.value = todayString();
          if (form.elements.followUpDate) form.elements.followUpDate.value = addDaysString(todayString(), 7);
          if (statusInput.value === "Paid") {
            if (form.elements.paymentStatus) form.elements.paymentStatus.value = "Paid";
            if (form.elements.completedDate && !form.elements.completedDate.value) form.elements.completedDate.value = todayString();
          }
        });
      }

      function attachPaymentFormSync() {
        var form = document.getElementById("jobForm");
        if (!form) return;
        var invoiceInput = form.elements.invoiceAmount;
        var paidInput = form.elements.amountPaid;
        var statusInput = form.elements.status;
        var paymentInput = form.elements.paymentStatus;
        if (!invoiceInput || !paidInput || !statusInput) return;

        function syncPaymentFields() {
          var candidate = {
            status: statusInput.value,
            nextAction: form.elements.nextAction ? form.elements.nextAction.value : "",
            nextActionDate: form.elements.nextActionDate ? form.elements.nextActionDate.value : "",
            invoiceSentDate: form.elements.invoiceSentDate ? form.elements.invoiceSentDate.value : "",
            invoiceAmount: numberValue(invoiceInput.value),
            amountPaid: numberValue(paidInput.value),
            paymentStatus: paymentInput ? paymentInput.value : "Invoice Needed",
            dueDate: form.elements.dueDate ? form.elements.dueDate.value : "",
            followUpDate: form.elements.followUpDate ? form.elements.followUpDate.value : "",
            completedDate: form.elements.completedDate ? form.elements.completedDate.value : "",
            reviewRequested: form.elements.reviewRequested ? !!form.elements.reviewRequested.checked : false,
            reviewRequestDate: form.elements.reviewRequestDate ? form.elements.reviewRequestDate.value : "",
            reviewReceived: form.elements.reviewReceived ? !!form.elements.reviewReceived.checked : false
          };
          applyPaymentProgressRules(candidate);
          statusInput.value = candidate.status;
          if (paymentInput) paymentInput.value = candidate.paymentStatus;
          if (form.elements.nextAction && form.elements.nextAction.value !== candidate.nextAction) form.elements.nextAction.value = candidate.nextAction;
          if (form.elements.nextActionDate && form.elements.nextActionDate.value !== candidate.nextActionDate) form.elements.nextActionDate.value = candidate.nextActionDate;
          if (form.elements.followUpDate && form.elements.followUpDate.value !== candidate.followUpDate) form.elements.followUpDate.value = candidate.followUpDate;
          if (form.elements.completedDate && form.elements.completedDate.value !== candidate.completedDate) form.elements.completedDate.value = candidate.completedDate;
        }

        ["input", "change"].forEach(function (eventName) {
          invoiceInput.addEventListener(eventName, syncPaymentFields);
          paidInput.addEventListener(eventName, syncPaymentFields);
          if (form.elements.dueDate) form.elements.dueDate.addEventListener(eventName, syncPaymentFields);
        });
      }

      function fieldDef(key) {
        return fields.concat(optionalFields).find(function (field) { return field[0] === key; });

      function formSection(title, keys, job, tone) {
        var section = el("section", "form-section");

      function formField(def, job) {
        var key = def[0];
        var labelText = def[1];
        var type = def[2];
        var required = def[3];
        var field = el("div", (key === "notes" ? "field full" : "field") + (required ? " required" : ""));
        var label = el("label", "", labelText);
        if (required) label.appendChild(el("span", "required-tag", "Required"));
        label.setAttribute("for", "field_" + key);
        field.appendChild(label);
        var input;
        if (type === "textarea") {
          input = document.createElement("textarea");
          input.value = job[key] || "";
          if (placeholders[key]) input.placeholder = placeholders[key];
        } else if (type === "selectStatus" || type === "selectPayment" || type === "selectEstimate") {
          input = document.createElement("select");
          var opts = type === "selectStatus" ? statuses : type === "selectPayment" ? paymentStatuses : estimateStatuses;
          opts.forEach(function (option) {
            var opt = document.createElement("option");
            opt.value = option;
            opt.textContent = type === "selectStatus" ? statusLabel(option) : option;
            if (job[key] === option) opt.selected = true;
            input.appendChild(opt);
          });
        } else {
          input = document.createElement("input");
          input.type = type === "checkbox" ? "checkbox" : type;
          if (type === "checkbox") {
            input.checked = !!job[key];
          } else {
            input.value = job[key] == null ? "" : String(job[key]);
          }
          if (type === "number") {
            input.min = "0";
            input.step = "1";
            input.inputMode = "decimal";
          }
          if (placeholders[key]) input.placeholder = placeholders[key];
        }
        input.id = "field_" + key;
        input.name = key;
        if (required) input.required = true;
        field.appendChild(input);
        return field;
      }

      function saveJobFromForm(event) {
        event.preventDefault();
        var form = document.getElementById("jobForm");
        var data = {};
        fields.concat(optionalFields).forEach(function (field) {
          var key = field[0];
          var type = field[2];
          var input = form.elements[key];
          if (!input) return;
          if (type === "checkbox") data[key] = !!input.checked;
          else if (type === "number") data[key] = numberValue(input.value);
          else data[key] = input.value.trim();
        });
        var now = new Date().toISOString();
        if (editingJobId) {
          var index = state.jobs.findIndex(function (job) { return job.id === editingJobId; });
          if (index >= 0) {
            state.jobs[index] = normalizeJob(Object.assign({}, state.jobs[index], data, { updatedAt: now }));
          }
        } else {
          state.jobs.unshift(normalizeJob(Object.assign(data, { id: newId(), createdAt: now, updatedAt: now })));
        }
        state.meta.onboarded = true;
        saveState(true);
        closeJobModal();
        render();
      }

      function exportCsv() {
        var headers = ["Client", "Phone", "Email", "Address", "Job Type", "Status", "Next Action", "Follow Up", "Invoice Amount", "Amount Paid", "Balance Due", "Due Date", "Payment Status", "Notes"];
        var rows = state.jobs.map(function (job) {
          return [
            job.clientName,
            job.phone,
            job.email,
            job.serviceAddress,
            job.jobType,
            statusLabel(job.status),
            job.nextAction,
            job.followUpDate,
            job.invoiceAmount,
            job.amountPaid,
            balanceDue(job),
            job.dueDate,
            job.paymentStatus,
            job.notes
          ];
        });
        var csv = [headers].concat(rows).map(function (row) {
          return row.map(csvEscape).join(",");
        }).join("\r\n");
        downloadFile("contractor-tracker-jobs-" + todayString() + ".csv", csv, "text/csv");
      }

      function csvEscape(value) {
        var text = value == null ? "" : String(value);
        if (/[",\r\n]/.test(text)) return '"' + text.replace(/"/g, '""') + '"';
        return text;
      }

      function downloadFile(filename, content, type) {
        var blob = new Blob([content], { type: type });
        var url = URL.createObjectURL(blob);
        var link = document.createElement("a");
        link.href = url;
        link.download = filename;
        document.body.appendChild(link);
        link.click();
        link.remove();
        setTimeout(function () { URL.revokeObjectURL(url); }, 0);
      }

      function chooseImport() {
        var input = document.getElementById("importFile");
        input.value = "";
        input.click();
      }

      function handleImportFile(event) {
        var file = event.target.files && event.target.files[0];
        if (!file) return;
        var reader = new FileReader();
        reader.onload = function () {
          try {
            var parsed = JSON.parse(String(reader.result || ""));
            var result = validateState(parsed);
            if (!result.ok) {
              showImportError(result.message);
              return;
            }
            pendingImport = normalizeState(parsed);
            openImportPreview();
          } catch (error) {
            showImportError("This backup file could not be read. Your current data was not changed.");
          }
        };
        reader.onerror = function () {
          showImportError("This backup file could not be read. Your current data was not changed.");
        };
        reader.readAsText(file);
      }

      function showImportError(message) {
        storageWarning = message;
        recoveryMode = false;
        if (!state) state = getDefaultState();
        document.getElementById("importFile").value = "";
        activeTab = "Data";
        render();
      }

      function openImportPreview() {
        var root = document.getElementById("importPreview");
        root.textContent = "";
        var panel = el("div", "notice warning");
        var copy = el("div");
        copy.appendChild(el("h3", "", "Import will replace current jobs"));
        copy.appendChild(el("p", "", "Backup jobs: " + pendingImport.jobs.length + ". Current jobs in this browser: " + state.jobs.length + ". Current data is unchanged until you confirm."));
        var meta = el("p", "", "Backup date: " + (pendingImport.meta.lastBackupExportedAt ? new Date(pendingImport.meta.lastBackupExportedAt).toLocaleString() : "Not included"));
        copy.appendChild(meta);
        panel.appendChild(copy);
        root.appendChild(panel);
        document.getElementById("importModal").classList.add("open");
      }

      function closeImportModal() {
        pendingImport = null;
        document.getElementById("importFile").value = "";
        document.getElementById("importModal").classList.remove("open");
      }

      function confirmImport() {
        if (!pendingImport) return;
        if (!window.confirm("Importing this backup will replace the jobs currently saved in this browser. Export a backup first if you want to keep them.")) return;
        state = pendingImport;
        state.meta.onboarded = true;
        recoveryMode = false;
        storageWarning = "";
        saveState(false);
        closeImportModal();
        activeTab = "Today";
        render();
      }

      function resetData() {
        if (!window.confirm("Erase all jobs, payments, notes, and settings saved in this browser? Export a backup first if you want to keep them.")) return;
        if (!window.confirm("This will permanently remove the data saved in this browser. Continue?")) return;
        recoveryMode = false;
        rawCorruptedState = "";
        storageWarning = "";
        state = createState([], true);
        try {
          localStorage.setItem(activeStorageKey(), JSON.stringify(state));
        } catch (error) {
          storageWarning = "This browser is blocking local storage. Reset could not be saved.";
        }
        render();
      }

      function useSampleData() {
        state = createState(getSampleJobs(), true);
        saveState(false);
        render();
      }

      function reloadSampleData() {
        if (!window.confirm("Replace your current jobs with sample data? Export a backup first if you want to keep your current jobs.")) return;
        if (!window.confirm("This will overwrite the jobs saved in this browser. Continue?")) return;
        state = createState(getSampleJobs(), true);
        saveState(false);
        activeTab = "Today";
        render();
      }

      function startBlank() {
        state = createState([], true);
        saveState(false);
        render();
      }

      function closeHelpTips(exceptButton) {
        document.querySelectorAll(".help-wrap").forEach(function (wrap) {
          var buttonNode = wrap.querySelector(".help-tip");
          var popover = wrap.querySelector(".help-popover");
          if (!buttonNode || !popover || buttonNode === exceptButton) return;
          buttonNode.setAttribute("aria-expanded", "false");
          popover.hidden = true;
        });
      }

      function toggleHelpTip(buttonNode) {
        var wrap = buttonNode.closest(".help-wrap");
        if (!wrap) return;
        var popover = wrap.querySelector(".help-popover");
        if (!popover) return;
        var willOpen = popover.hidden;
        closeHelpTips(buttonNode);
        popover.hidden = !willOpen;
        buttonNode.setAttribute("aria-expanded", willOpen ? "true" : "false");
      }

      document.addEventListener("click", function (event) {
        var target = event.target.closest("[data-action]");
        if (!target) {
          if (!event.target.closest(".help-wrap")) closeHelpTips();
          return;
        }
        var action = target.dataset.action;
        var value = target.dataset.value;
        if (action === "toggle-help") {
          toggleHelpTip(target);
          return;
        }
        if (!target.closest(".help-wrap")) closeHelpTips();
        if (action === "set-tab") {
          activeTab = value;
          render();
        }
        if (action === "set-route-filter") {
          setRouteFilter(value);
        }
        if (action === "show-jobs-preset") showJobsPreset(value);
        if (action === "set-money-preset") setMoneyPreset(value);
        if (action === "new-job") openJobModal();
        if (action === "edit-job") openJobModal(value);
        if (action === "close-job-modal") closeJobModal();
        if (action === "close-import-modal") closeImportModal();
        if (action === "use-sample") useSampleData();
        if (action === "start-blank") startBlank();
        if (action === "export-backup") exportBackup();
        if (action === "export-csv") exportCsv();
        if (action === "choose-import") chooseImport();
        if (action === "dismiss-backup") {
          state.meta.backupReminderDismissedAt = new Date().toISOString();
          saveState(false);
          render();
        }
        if (action === "reload-sample") reloadSampleData();
        if (action === "reset-data") resetData();
        if (action === "export-raw") exportRaw();
      });

      document.addEventListener("input", function (event) {
        var input = event.target;
        if (!input.dataset || (!input.dataset.filter && !input.dataset.moneyFilter)) return;
        var activeId = input.id;
        var selectionStart = input.selectionStart;
        var selectionEnd = input.selectionEnd;
        if (input.dataset.filter) filters[input.dataset.filter] = input.value;
        if (input.dataset.moneyFilter) {
          var moneyKey = input.dataset.moneyFilter.replace(/^money/, "");
          moneyKey = moneyKey.charAt(0).toLowerCase() + moneyKey.slice(1);
          moneyFilters[moneyKey] = input.value;
        }
        render();
        var nextInput = activeId ? document.getElementById(activeId) : null;
        if (nextInput) {
          nextInput.focus();
          if (typeof nextInput.setSelectionRange === "function" && selectionStart !== null && selectionEnd !== null) {
            nextInput.setSelectionRange(selectionStart, selectionEnd);
          }
        }
      });

      document.addEventListener("change", function (event) {
        var input = event.target;
        if (!input.dataset || (!input.dataset.filter && !input.dataset.moneyFilter)) return;
        if (input.dataset.filter) filters[input.dataset.filter] = input.value;
        if (input.dataset.moneyFilter) {
          var moneyKey = input.dataset.moneyFilter.replace(/^money/, "");
          moneyKey = moneyKey.charAt(0).toLowerCase() + moneyKey.slice(1);
          moneyFilters[moneyKey] = input.value;
        }
        render();
      });

      document.getElementById("jobForm").addEventListener("submit", saveJobFromForm);
      document.getElementById("deleteJobButton").addEventListener("click", deleteCurrentJob);
      document.getElementById("importFile").addEventListener("change", handleImportFile);
      document.getElementById("confirmImportButton").addEventListener("click", confirmImport);

      if ("serviceWorker" in navigator && /^https?:$/.test(window.location.protocol)) {
        navigator.serviceWorker.register("service-worker.js").catch(function () {
          // Local file mode still works; service worker is only for hosted phone install.
        });
      }

      loadState();
      render();
    })();
  </script>
</body>
</html>
