    :root {

    html {

    body {

    :focus-visible {

      outline-offset: 4px;
    }

    .container {

      margin: 0 auto;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      border-bottom: 1px solid rgba(200, 216, 220, 0.85);
      background: rgba(238, 245, 247, 0.92);
      backdrop-filter: blur(18px);

    .nav {
      min-height: 78px;
      display: flex;
      align-items: center;
      justify-content: space-between;

      font-size: 0.94rem;
      font-weight: 850;
      text-decoration: none;
    }

    .nav-actions .button {
      color: #fff;
    }

    .button {
      display: inline-flex;
      min-height: 46px;
      align-items: center;
      justify-content: center;
      border: 1px solid transparent;
      border-radius: 8px;
      background: var(--primary);
      padding: 12px 18px;
      color: #fff;
      font-weight: 900;
      line-height: 1;
      text-decoration: none;

    .button:hover {

    }

    .button-secondary {
      border-color: rgba(22, 35, 38, 0.15);
      background: rgba(255, 255, 255, 0.82);

    }

    .button-secondary:hover {
      background: #fff;
    }

    main {

    .guide-hero {
      display: grid;
      grid-template-columns: 1fr;
      gap: clamp(2rem, 4vw, 3.5rem);
      align-items: start;
    }

    .intro {
      max-width: 900px;
      margin: 0 auto;
      text-align: center;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
      color: var(--text-strong);
      font-size: 0.88rem;
      font-weight: 950;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .eyebrow::before {
      content: "";
      width: 36px;
      height: 4px;
      border-radius: 999px;
      background: var(--teal);
    }

    h1,
    p,
    figure {
      margin-top: 0;

    h1 {
      margin-bottom: 18px;
      color: var(--text-strong);
      font-size: clamp(3rem, 6.4vw, 6rem);

      line-height: 0.98;
      letter-spacing: 0;

      font-size: 1.1rem;
    }

    .intro p {

      margin-right: auto;
      margin-bottom: 26px;
      margin-left: auto;
      color: #41545a;
      font-size: clamp(1.22rem, 1.65vw, 1.55rem);
      font-weight: 650;
      line-height: 1.45;
    }

    .intro-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
    }

    .guide-carousel {
      display: grid;
      gap: 18px;
      min-width: 0;
      width: min(1180px, 100%);
      margin: 0 auto;
    }

    .carousel-stage {
      position: relative;
      min-height: clamp(600px, 68vw, 860px);
      perspective: 1600px;
      padding-bottom: 58px;
    }

    .guide-slide {
      position: absolute;
      inset: 0;
      display: grid;
      align-content: start;
      overflow: hidden;
      border: 1px solid rgba(22, 35, 38, 0.14);
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.96);
      padding: clamp(0.8rem, 1.4vw, 1.25rem);
      box-shadow: var(--shadow);
      opacity: 0;
      pointer-events: none;
      transform: translateX(42px) translateY(22px) scale(0.93);
      will-change: opacity, transform;
      transition: opacity 180ms ease, transform 240ms ease, box-shadow 180ms ease;
    }

    .guide-slide.is-active {
      z-index: 4;
      opacity: 1;
      pointer-events: auto;
      transform: translateX(0) translateY(0) scale(1);
    }

    .guide-slide.is-next {
      z-index: 3;
      opacity: 0.4;
      transform: translateX(36px) translateY(28px) scale(0.96);
      box-shadow: var(--shadow-soft);
    }

    .guide-slide.is-after {
      z-index: 2;
      opacity: 0.14;
      transform: translateX(68px) translateY(56px) scale(0.92);
      box-shadow: none;
    }

    .guide-slide img {
      width: 100%;
      aspect-ratio: 4 / 3;
      border-radius: 14px;
      object-fit: contain;
      background: #fff;
    }

    .slide-caption {

      align-items: flex-start;
      justify-content: space-between;
      gap: 18px;
      padding: 16px 4px 2px;
    }

    .slide-caption strong {
      display: block;
      color: var(--text-strong);
      font-size: 1.2rem;
      font-weight: 950;
      line-height: 1.1;
    }

    .slide-caption span {
      display: block;
      max-width: 390px;
      margin-top: 5px;
      color: var(--muted);
      font-size: 0.94rem;
      font-weight: 700;
      line-height: 1.35;

    .slide-count {
      flex: 0 0 auto;
      border-radius: 999px;
      background: #e6f7f5;
      padding: 7px 10px;
      color: var(--primary-dark);
      font-size: 0.82rem;
      font-weight: 950;
      line-height: 1;
      white-space: nowrap;
    }

    .carousel-controls {
      position: absolute;
      right: auto;
      bottom: clamp(5.7rem, 7vw, 6.6rem);

      align-items: center;

      background: rgba(255, 255, 255, 0.9);
      padding: 8px;
      box-shadow: 0 16px 38px rgba(15, 23, 42, 0.16);
      transform: translateX(-50%);
      backdrop-filter: blur(16px);
    }

      display: inline-flex;
      gap: 10px;

    .carousel-button {

      height: 44px;

      border: 1px solid var(--line);
      border-radius: 999px;
      background: #fff;

      font-size: 1.35rem;
      font-weight: 950;
      line-height: 1;

    }

    .carousel-button:hover {
      border-color: var(--primary);
      background: #f6fbfb;
      transform: translateY(-1px);
    }

    .current-label {
      position: absolute;
      width: 1px;
      height: 1px;
      margin: -1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      color: var(--text-strong);
      font-size: 0.95rem;
      font-weight: 900;
    }

    .thumb-list {
      display: flex;
      flex-wrap: nowrap;
      justify-content: center;
      gap: 8px;
      overflow-x: auto;
      border: 1px solid rgba(22, 35, 38, 0.12);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.74);
      padding: 10px;
      box-shadow: 0 16px 36px rgba(15, 23, 42, 0.1);
      scrollbar-width: thin;
    }

    .thumb-button {
      flex: 0 0 auto;
      min-width: 112px;
      min-height: 50px;

      border-color: rgba(36, 124, 130, 0.5);
      background: var(--primary);
      color: var(--primary-dark);
      color: #fff;
      box-shadow: 0 13px 28px rgba(36, 124, 130, 0.24);
      transform: translateY(-1px);
    }

    .noscript-grid {
      display: none;
    }

    @media (prefers-reduced-motion: reduce) {

      *::before,

        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }

    @media (max-width: 980px) {
      .guide-hero {

    @media (max-width: 680px) {

      main {

      .carousel-stage {

      .guide-slide {

      .guide-slide.is-next,

      .slide-caption {
        display: grid;
        gap: 10px;
      }

      .carousel-controls {
        bottom: 5.25rem;
      }

      .thumb-list {
        gap: 10px;
        justify-content: flex-start;
        border-radius: 18px;
      }

      .thumb-button {
        min-width: 110px;

      }
    }

    @media (max-width: 420px) {
      .carousel-stage {
        min-height: 385px;

      }

      }
    }
  </style>

</head>

      var thumbs = Array.prototype.slice.call(document.querySelectorAll(".thumb-button"));
      var label = document.querySelector("[data-carousel-label]");
      var prev = document.querySelector("[data-carousel-prev]");
      var next = document.querySelector("[data-carousel-next]");
      var activeIndex = 0;
      var carousel = document.querySelector(".guide-carousel");

      if (!slides.length) {
        return;
      }

      function wrap(index) {
        return (index + slides.length) % slides.length;
      }

      function update(index) {
        activeIndex = wrap(index);

        slides.forEach(function (slide, slideIndex) {
          slide.classList.remove("is-active", "is-next", "is-after");

          if (slideIndex === activeIndex) {
            slide.classList.add("is-active");
          } else if (slideIndex === wrap(activeIndex + 1)) {
            slide.classList.add("is-next");
          } else if (slideIndex === wrap(activeIndex + 2)) {
            slide.classList.add("is-after");
          }

          slide.setAttribute("aria-hidden", slideIndex === activeIndex ? "false" : "true");
        });

        thumbs.forEach(function (thumb, thumbIndex) {
          thumb.setAttribute("aria-selected", thumbIndex === activeIndex ? "true" : "false");
          thumb.tabIndex = thumbIndex === activeIndex ? 0 : -1;
        });

        if (label) {
          label.textContent = slides[activeIndex].getAttribute("data-title") || "";
        }
      }

      thumbs.forEach(function (thumb) {
        thumb.addEventListener("click", function () {
          update(Number(thumb.getAttribute("data-slide-to")));
        });
      });

      if (prev) {
        prev.addEventListener("click", function () {
          update(activeIndex - 1);
        });
      }

      if (next) {
        next.addEventListener("click", function () {
          update(activeIndex + 1);
        });
      }

      if (carousel) {
        carousel.addEventListener("keydown", function (event) {
          if (!event.target.closest(".thumb-button, .carousel-button")) {
            return;
          }

        if (event.key === "ArrowLeft") {
          event.preventDefault();
          update(activeIndex - 1);
          thumbs[activeIndex].focus();
        }

        if (event.key === "ArrowRight") {
          event.preventDefault();
          update(activeIndex + 1);
          thumbs[activeIndex].focus();
        }

        if (/^[1-7]$/.test(event.key)) {
          event.preventDefault();
          update(Number(event.key) - 1);
          thumbs[activeIndex].focus();
        }
        });
      }
    }());
  </script>
</body>
</html>
