<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JobDue Cover Image</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="asset cover" data-export="cover-image" data-size="cover">
    <div class="brand-row">
      <div class="brand-mark"><img src="../../../../assets/jobdue-product-mark-128.png" alt=""></div>
      <div>
        <p class="brand-name">JobDue</p>
        <p class="tagline">Track jobs. Follow up. Get paid.</p>
      </div>
    </div>
    <section class="hero-grid">
      <div>
        <h1 class="headline">Contractor Job, Payment &amp; Follow-Up Tracker</h1>
        <p class="subhead">See who needs payment or follow-up today.</p>
        <div class="claim-row">
          <span class="pill">No login</span>
          <span class="pill">No subscription</span>
          <span class="pill">Works in your browser</span>
        </div>
      </div>
      <div class="mock-window">
        <div class="mock-top"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
        <div class="mock-screen">
          <img src="../../01-screenshots/selected-for-video/01-today-money-to-collect-desktop.png" alt="JobDue Today screen">
        </div>
      </div>
    </section>
    <p class="footer-note">Offline browser app for solo handymen and small home-service operators.</p>
  </main>
</body>
</html>
